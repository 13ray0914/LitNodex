[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "litnodex"
dynamic = ["version"]
description = "Local-first, evidence-traceable scientific literature review workspace"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
keywords = ["literature-review", "scientific-papers", "knowledge-graph", "evidence"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "requests>=2.32,<3",
  "lxml>=5.3,<7",
  "jsonschema>=4.23,<5",
  "rapidfuzz>=3.9,<4",
  "pymupdf>=1.24,<2",
  "pyiso4==0.1.6",
]

[project.optional-dependencies]
network = [
  "numpy>=1.26,<2",
  "scipy>=1.11,<2",
  "scikit-learn>=1.5,<2",
  "networkx>=3.3,<4",
  "igraph>=0.11,<1",
  "leidenalg>=0.10,<1",
]
specter2 = [
  "numpy>=1.26,<2",
  "torch>=2.2,<3",
  "transformers>=4.46,<6",
  "adapters>=1.1,<2",
  "safetensors>=0.4,<1",
]
dev = ["build>=1.2,<2"]

[project.scripts]
litnodex = "litnodex.cli:main"

[project.urls]
Homepage = "https://github.com/13ray0914/LitNodex"
Repository = "https://github.com/13ray0914/LitNodex.git"
Issues = "https://github.com/13ray0914/LitNodex/issues"

[tool.setuptools]
packages = ["litnodex", "lib"]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "litnodex.__version__"}
